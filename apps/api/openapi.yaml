openapi: 3.1.0
info:
  title: Pipewhere API
  version: 0.1.0
  license:
    name: Elastic License 2.0
    identifier: Elastic-2.0
  description: |
    Every interface to Pipewhere, including Web, MCP, and the CLI, uses this API and its vocabulary.

    - An **organization** is the ownership boundary. Auth manages organizations, their members, and their API keys.
    - A **channel** links one external account to one organization.
    - **Content** is private source writing, with no channel or time.
    - A **publication** is one snapshot of text for one channel. It is the unit of scheduling, state, and outcome.
    - A **publication attempt** records one execution of a publication, and explains its failure or unknown outcome.

    "Post" means the remote post a provider creates. It is not a Pipewhere entity.

    Every request names one organization in its path, and API checks the caller against it before reading or writing anything. A resource that belongs to another organization is reported as not found, exactly as a resource that does not exist.

    Every id is a prefix and a UUIDv7 in lowercase Crockford base32, such as `pub_01m36mep00e3ca12pwd1gkjwex`.

    Times are RFC 3339 timestamps in UTC.

    This document is the contract. Endpoints that API does not serve yet are marked `x-pipewhere-status: planned`.
servers:
  - url: http://localhost:3002
    description: The local Compose stack
security:
  - bearer: []
tags:
  - name: Organizations
    description: The ownership boundary. Auth manages organizations; API reads them.
  - name: Channels
    description: An organization's links to external accounts.
  - name: Content
    description: Private source writing.
  - name: Publications
    description: One snapshot of text for one channel, its state, and its attempts.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that API is running
      security: []
      responses:
        "200":
          description: API is running. This says nothing about Auth or PostgreSQL.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true

  /v1/orgs/{organization_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganization
      tags: [Organizations]
      summary: Read the organization and the caller's access to it
      description: Any member and any key the organization owns may read it. A client can use it to check that a token works and to see whose access it carries.
      responses:
        "200":
          description: The organization, and the actor making the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/channels:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listChannels
      tags: [Channels]
      summary: List the organization's channels
      x-pipewhere-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of channels, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/channels/{channel_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: channel_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ChannelId"
    get:
      operationId: getChannel
      tags: [Channels]
      summary: Read a channel
      x-pipewhere-status: planned
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/contents:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createContent
      tags: [Content]
      summary: Write new content
      description: Content is private. Writing it publishes nothing and schedules nothing.
      x-pipewhere-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "201":
          description: The content was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    get:
      operationId: listContents
      tags: [Content]
      summary: List the organization's content
      x-pipewhere-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of content, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/contents/{content_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: content_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ContentId"
    get:
      operationId: getContent
      tags: [Content]
      summary: Read content
      x-pipewhere-status: planned
      responses:
        "200":
          description: The content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    patch:
      operationId: updateContent
      tags: [Content]
      summary: Edit content
      description: Editing content never edits a publication made from it. Each publication keeps the copy of the text it took when it was created.
      x-pipewhere-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "200":
          description: The edited content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/publications:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: createPublication
      tags: [Publications]
      summary: Schedule a publication to one channel
      description: |
        Creates one publication, in `scheduled`, for one channel. To send the same writing to several channels, create one publication per channel. Give the first request the text, and refer later requests to the content it created.

        The publication copies its text when it is created. Later edits to the content do not change it.

        A publication with no `planned_at` is planned for the time of the request, and takes the same path as any other.
      x-pipewhere-status: planned
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationInput"
      responses:
        "201":
          description: |
            The publication was created. A repeated request with the same `Idempotency-Key` and the same body returns this response again, with the same publication, and creates nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RequestInProgress"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    get:
      operationId: listPublications
      tags: [Publications]
      summary: List the organization's publications
      x-pipewhere-status: planned
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only publications in one of these states. Repeat the parameter to name several.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PublicationState"
          style: form
          explode: true
        - name: channel_id
          in: query
          description: Only publications to this channel.
          schema:
            $ref: "#/components/schemas/ChannelId"
        - name: content_id
          in: query
          description: Only publications made from this content.
          schema:
            $ref: "#/components/schemas/ContentId"
      responses:
        "200":
          description: One page of publications, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/publications/{publication_id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PublicationId"
    get:
      operationId: getPublication
      tags: [Publications]
      summary: Read a publication
      x-pipewhere-status: planned
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
    patch:
      operationId: updatePublication
      tags: [Publications]
      summary: Edit one channel's copy
      description: |
        Changes only this publication. The content it was made from, and other publications made from that content, stay as they are.

        - In `scheduled`, the body and `planned_at` may change.
        - In `failed`, only the body may change, so the operator can fix what the provider rejected before retrying. A retry sets the new time.
        - In any other state, the request is refused with `invalid_state`.
      x-pipewhere-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationUpdate"
      responses:
        "200":
          description: The edited publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/publications/{publication_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PublicationId"
    post:
      operationId: cancelPublication
      tags: [Publications]
      summary: Cancel a publication before its provider commit starts
      description: |
        Moves a publication from `scheduled` or `preparing` to `cancelled`. Once a provider commit may have started, in `publishing`, a publication can no longer be cancelled.

        Cancelling a publication that is already `cancelled` returns it unchanged.
      x-pipewhere-status: planned
      responses:
        "200":
          description: The cancelled publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/publications/{publication_id}/retry:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PublicationId"
    post:
      operationId: retryPublication
      tags: [Publications]
      summary: Retry a failed publication
      description: |
        Moves a publication from `failed` back to `scheduled`. Its next run creates another attempt. This is the only way out of `failed`.

        A publication in `outcome_unknown` cannot be retried, because a remote post may already exist. Resolve it first.
      x-pipewhere-status: planned
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryInput"
      responses:
        "200":
          description: |
            The publication, back in `scheduled`. A repeated request with the same `Idempotency-Key` and the same body returns this response again, and retries nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The publication is not in `failed`, or another request with the same `Idempotency-Key` is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_state:
                  value: { code: invalid_state }
                request_in_progress:
                  value: { code: request_in_progress }
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/publications/{publication_id}/resolve:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PublicationId"
    post:
      operationId: resolvePublication
      tags: [Publications]
      summary: Settle a publication whose outcome is unknown
      description: |
        Only a person settles an unknown outcome. Pipewhere never retries a publication in `outcome_unknown` on its own, because a remote post may already exist.

        - `published`, with the remote post's reference, when the post went out.
        - `failed`, when the person has checked that nothing was posted. The publication can then be edited and retried.

        The resolution records who settled it and when.
      x-pipewhere-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolutionInput"
      responses:
        "200":
          description: The resolved publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

  /v1/orgs/{organization_id}/publications/{publication_id}/attempts:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/PublicationId"
    get:
      operationId: listPublicationAttempts
      tags: [Publications]
      summary: List a publication's attempts
      description: Every attempt the publication has run, first to last. An operator reads these to see what failed and why, or why an outcome is unknown, without reading server logs.
      x-pipewhere-status: planned
      responses:
        "200":
          description: Every attempt, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicationAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthUnavailable"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token from Auth. A signed-in user gets one from `GET /api/auth/token`. An API key is exchanged for one at `POST /api-key/token`, with the key in an `x-api-key` header. A token lasts 15 minutes.

  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationId"
    PublicationId:
      name: publication_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicationId"
    Limit:
      name: limit
      in: query
      description: The most items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Omit it for the first page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key the client generates once per operation, and sends again on every retry of that operation. It must carry at least 128 random bits, such as 16 random bytes in base64url. A UUIDv4 carries only 122.

        - The same key with the same request returns the first request's stored response, and does nothing more.
        - The same key with a different request is refused with `idempotency_key_reused`.
        - While a request with the key is still running, another is refused with `request_in_progress`. Send it again later.

        A key is unique within the organization, across every user and API key in it. A stored response is kept as long as its publication's history, and returned only after the current caller passes the organization check.

        Retrying a request with a new key is a new operation, and can create a second publication.
      schema:
        type: string
        minLength: 22
        maxLength: 255
        pattern: "^[\\x21-\\x7e]+$"

  responses:
    InvalidRequest:
      description: The request is malformed, a field is invalid, or a referenced channel or content does not exist in this organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: invalid_request, field: planned_at }
    Unauthorized:
      description: The request carries no valid access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: unauthorized }
    NotFound:
      description: The organization, or the resource, does not exist, or the caller has no access to it. These cases are indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: not_found }
    InvalidState:
      description: The publication's state does not allow this transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: invalid_state, state: publishing }
    RequestInProgress:
      description: Another request with the same `Idempotency-Key` is still running.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: request_in_progress }
    IdempotencyKeyReused:
      description: The `Idempotency-Key` was already used for a different request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: idempotency_key_reused }
    AuthUnavailable:
      description: API could not fetch the key that signed the token from Auth. Tokens whose keys API already holds still work.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: auth_unavailable }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            - `invalid_request` (400): see `field`.
            - `unauthorized` (401).
            - `not_found` (404), also for an unknown path.
            - `method_not_allowed` (405).
            - `invalid_state` (409): see `state`.
            - `request_in_progress` (409).
            - `idempotency_key_reused` (422).
            - `internal` (500).
            - `auth_unavailable` (503).
          enum:
            - invalid_request
            - unauthorized
            - not_found
            - method_not_allowed
            - invalid_state
            - request_in_progress
            - idempotency_key_reused
            - internal
            - auth_unavailable
        field:
          type: string
          description: For `invalid_request`, the field at fault, when there is one.
        state:
          $ref: "#/components/schemas/PublicationState"
          description: For `invalid_state`, the publication's current state.

    OrganizationId:
      type: string
      pattern: "^org_[0-9a-hjkmnp-tv-z]{26}$"
      examples: [org_01m36mep00e3ca12pwd1gkjwex]
    ChannelId:
      type: string
      pattern: "^chn_[0-9a-hjkmnp-tv-z]{26}$"
      examples: [chn_01m36mep00e3ca12pwd1gkjwex]
    ContentId:
      type: string
      pattern: "^cnt_[0-9a-hjkmnp-tv-z]{26}$"
      examples: [cnt_01m36mep00e3ca12pwd1gkjwex]
    PublicationId:
      type: string
      pattern: "^pub_[0-9a-hjkmnp-tv-z]{26}$"
      examples: [pub_01m36mep00e3ca12pwd1gkjwex]
    PublicationAttemptId:
      type: string
      pattern: "^att_[0-9a-hjkmnp-tv-z]{26}$"
      examples: [att_01m36mep00e3ca12pwd1gkjwex]

    Actor:
      description: Who made a request.
      oneOf:
        - type: object
          title: User
          required: [type, id, role]
          properties:
            type:
              const: user
            id:
              type: string
              pattern: "^usr_[0-9a-hjkmnp-tv-z]{26}$"
            role:
              type: string
              description: The user's role in the organization when the request was made.
        - type: object
          title: API key
          required: [type, id]
          properties:
            type:
              const: api_key
            id:
              type: string
              pattern: "^key_[0-9a-hjkmnp-tv-z]{26}$"

    Organization:
      type: object
      required: [id, name, slug, actor]
      properties:
        id:
          $ref: "#/components/schemas/OrganizationId"
        name:
          type: string
        slug:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"

    Channel:
      description: |
        One organization's link to one external account. Pipewhere does not model the account itself. Several organizations may link the same account, and each link is a separate channel that no other organization can see.

        Connecting a channel, and a channel's ability to publish, belong to the provider pipelines, which add their fields here.
      type: object
      required: [id, provider, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ChannelId"
        provider:
          type: string
          description: The service the external account belongs to. The provider pipelines add their values.
          enum: [mastodon, threads]
        created_at:
          type: string
          format: date-time
    ChannelPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    ContentInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          $ref: "#/components/schemas/Body"
    Content:
      description: Private source writing. It has no channel and no time, and nothing about it is public.
      type: object
      required: [id, body, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ContentId"
        body:
          $ref: "#/components/schemas/Body"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Content"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Body:
      type: string
      description: Plain text. Each channel's provider sets its own length limit, which the provider pipelines check.
      minLength: 1

    PublicationState:
      type: string
      description: |
        | State | Meaning |
        | --- | --- |
        | `scheduled` | Waiting for its time. Editable and cancellable. |
        | `preparing` | Preparing provider inputs. No public commit has started. Cancellable, not editable. |
        | `publishing` | A provider commit may have started. Neither editable nor cancellable. |
        | `published` | A remote post is confirmed. Final. |
        | `failed` | The provider definitely did not publish, or work stopped before the commit. Editable. Leaves only by an explicit retry. |
        | `outcome_unknown` | A remote post may exist. Never retried automatically. Leaves only when a person resolves it. |
        | `cancelled` | Stopped before the commit. Final. |

        The normal path is `scheduled`, `preparing`, `publishing`, `published`. The other transitions are:

        - `scheduled` or `preparing` to `failed`, or to `cancelled`, before the commit.
        - `publishing` to `preparing`, when the provider definitely did not publish and the work runs again automatically.
        - `publishing` to `failed`, when the provider definitely did not publish and the work stops.
        - `publishing` to `outcome_unknown`, when a remote post may exist.
        - `failed` to `scheduled`, on an explicit retry.
        - `outcome_unknown` to `published` or `failed`, when a person resolves it.

        No other transition happens. A client causes only these: create, cancel, retry, and resolve. Pipewhere's worker causes the rest.
      enum:
        - scheduled
        - preparing
        - publishing
        - published
        - failed
        - outcome_unknown
        - cancelled

    PublicationInput:
      description: Give exactly one of `body` and `content_id`. A `body` creates new content in the same request, and the publication copies it.
      type: object
      required: [channel_id]
      additionalProperties: false
      properties:
        channel_id:
          $ref: "#/components/schemas/ChannelId"
        body:
          $ref: "#/components/schemas/Body"
        content_id:
          $ref: "#/components/schemas/ContentId"
        planned_at:
          type: string
          format: date-time
          description: When to publish. Omit it to publish at the time of the request.
      oneOf:
        - required: [body]
        - required: [content_id]
    PublicationUpdate:
      description: Give at least one field.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        body:
          $ref: "#/components/schemas/Body"
        planned_at:
          type: string
          format: date-time
          description: Only while the publication is `scheduled`.
    RetryInput:
      type: object
      additionalProperties: false
      properties:
        planned_at:
          type: string
          format: date-time
          description: When to publish. Omit it to publish at the time of the request.
    ResolutionInput:
      oneOf:
        - type: object
          title: Published
          required: [result, remote_id]
          additionalProperties: false
          properties:
            result:
              const: published
            remote_id:
              type: string
              minLength: 1
              description: The provider's id for the remote post.
            remote_url:
              type: string
              format: uri
              description: The remote post's public address, when the provider has one.
        - type: object
          title: Failed
          required: [result]
          additionalProperties: false
          properties:
            result:
              const: failed

    Publication:
      description: One snapshot of text for one channel. Its body is its own copy. Once it is `published`, its body, `remote_id`, and `remote_url` never change.
      type: object
      required:
        - id
        - channel_id
        - content_id
        - body
        - state
        - planned_at
        - remote_id
        - remote_url
        - resolution
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/PublicationId"
        channel_id:
          $ref: "#/components/schemas/ChannelId"
        content_id:
          $ref: "#/components/schemas/ContentId"
          description: The content this publication was made from. Publications from the same writing share it.
        body:
          $ref: "#/components/schemas/Body"
        state:
          $ref: "#/components/schemas/PublicationState"
        planned_at:
          type: string
          format: date-time
          description: When the publication is planned to go out.
        remote_id:
          type: [string, "null"]
          description: The provider's id for the remote post. Set when the publication is `published`, and null otherwise.
        remote_url:
          type: [string, "null"]
          format: uri
          description: The remote post's public address. Null until `published`, and when the provider has none.
        resolution:
          description: Who settled an unknown outcome, and when. Null when no person has resolved one. A later unknown outcome, after a retry, replaces it once it is resolved.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Resolution"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Resolution:
      type: object
      required: [result, actor, resolved_at]
      properties:
        result:
          type: string
          enum: [published, failed]
        actor:
          $ref: "#/components/schemas/Actor"
        resolved_at:
          type: string
          format: date-time
    PublicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Publication"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    PublicationAttempt:
      description: |
        One execution of a publication: preparing its provider inputs, then the provider commit, up to its result. A publication that fails before its commit, such as one whose channel cannot publish at its planned time, also records an attempt, so its reason is readable.

        When the provider definitely did not publish and the work runs again automatically, that attempt ends as `retried`, and the next run is a new attempt. So every provider response has its own attempt.
      type: object
      required: [id, number, started_at, finished_at, result, reason]
      properties:
        id:
          $ref: "#/components/schemas/PublicationAttemptId"
        number:
          type: integer
          minimum: 1
          description: 1 for the publication's first attempt, counting up.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
          description: Null while the attempt is running.
        result:
          description: |
            - `published`: the remote post is confirmed.
            - `retried`: the provider definitely did not publish, and the work runs again automatically, as the next attempt.
            - `failed`: the provider definitely did not publish, or the work stopped before the commit.
            - `outcome_unknown`: a remote post may exist.
            - Null while the attempt is running.
          oneOf:
            - type: "null"
            - type: string
              enum: [published, retried, failed, outcome_unknown]
        reason:
          description: Why the attempt failed, was retried, or has an unknown outcome. Null when it published or is running.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AttemptReason"
    AttemptReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable, machine-readable cause. The scheduling and provider pipelines define the values.
          examples: [provider_rejected, provider_timeout, channel_unavailable]
        message:
          type: string
          description: A human-readable explanation, including the provider's own message when there is one.

    NextCursor:
      type: [string, "null"]
      description: Pass this as `cursor` to get the next page. Null on the last page.
