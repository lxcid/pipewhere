[package]
name = "pipewhere-worker"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pipewhere_worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
pipewhere-api = { path = "../api" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "http2",
  "json",
  "rustls-no-provider",
] }
restate-sdk = { version = "=0.12.1", default-features = false, features = ["http_server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["process"] }
